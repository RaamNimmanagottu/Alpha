  - {date: "31-Mar-2026", name: "Shri Mahavir Jayanti"}
  - {date: "03-Apr-2026", name: "Good Friday"}
  - {date: "14-Apr-2026", name: "Dr. Baba Saheb Ambedkar Jayanti"}
  - {date: "01-May-2026", name: "Maharashtra Day"}
  - {date: "28-May-2026", name: "Bakri Id"}
  - {date: "26-Jun-2026", name: "Muharram"}
  - {date: "14-Sep-2026", name: "Ganesh Chaturthi"}
  - {date: "02-Oct-2026", name: "Mahatma Gandhi Jayanti"}
  - {date: "20-Oct-2026", name: "Dussehra"}
  - {date: "08-Nov-2026", name: "Diwali Laxmi Pujan (Muhurat Trading only)"}
