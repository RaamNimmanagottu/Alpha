# Non-secret configuration for the trading bot.
# Secrets (API key, client code, PIN, TOTP secret) live in .env — never in this file.

poll_interval_seconds: 3       # how often the main loop re-evaluates each instrument
order_fill_timeout_seconds: 15 # how long to wait/poll for a placed order to confirm before giving up
order_fill_poll_seconds: 1

# PAPER TRADING: no real orders are placed while this is true -- entries/exits are
# simulated using live LTP and recorded exactly like real trades (same store, same
# risk manager, same signal logic), so the whole system gets exercised faithfully.
# Recommended: run this for ~30 days, review data/trades.db (or the Excel export --
# tools/export_trades_to_excel.py), and only THEN flip this to false by hand. There
# is no automatic graduation to real money anywhere in this codebase.
paper_trading: true

# Strike selection: "atm" (default, backtested) always buys the strike closest to
# spot. "delta" instead buys the strike whose |delta| is closest to target_delta,
# using Angel One's live optionGreek data -- automatically falls back to "atm" for
# that entry (with a Telegram warning) if greeks data is unavailable or invalid, so
# entries never block on this. "min_premium" (added 2026-09-18): start at ATM: if
# its own live premium is below that instrument's min_premium_threshold, walk into
# ITM strikes (closest first) until one clears it, else fall back to ATM -- an ATM
# option's delta is ~0.5 so its premium only tracks about half of the underlying's
# points-based move; an ITM strike has higher delta and tracks it more faithfully,
# without depending on optionGreek (which doesn't support every instrument type).
# NOT backtested -- a live-only strategy change, same as "delta" was.
strike_selection_mode: min_premium
target_delta: 0.5   # only used when strike_selection_mode is "delta"

# "Trader-style" live position monitoring, on top of the fixed points-based exits
# below. Every one of these is NOT backtested -- live-only additions -- and each
# has its own kill switch so any one of them can be disabled independently if it
# misbehaves, without touching the others.

# Trailing stop-loss: once the trade has moved trailing_stop_activation_points in
# its favor, the stop-loss trails trailing_stop_distance_points behind the best
# underlying price seen since entry. Can only tighten the stop, never loosen it
# below the original stop_loss_points level. Used only when trailing_stop_mode
# is "points" -- kept/still valid as a fallback/rollback option, not currently active.
trailing_stop_enabled: true
trailing_stop_activation_points: 50
trailing_stop_distance_points: 30

# trailing_stop_mode: "points" (the underlying-index-based mechanism just above) or
# "premium_pct_step" (added 2026-09-22, user-requested): a step-ladder trailing
# stop on the OPTION PREMIUM itself. Every time the premium rises by another
# trailing_stop_step_pct of the ENTRY premium, the stop locks in the PREVIOUS step
# -- e.g. entry=500, step_pct=5 (=25 points): premium touching 550 locks the stop
# at 525 (one step behind the new peak, not the just-crossed level itself). Works
# identically for CE and PE (this bot only buys options, never writes them, so a
# premium rise is always favorable regardless of direction). Purely additive to
# the index-based static stop-loss above -- never removes that protection, can
# only trigger an exit earlier/tighter. Not backtested; a live-only addition.
trailing_stop_mode: premium_pct_step
trailing_stop_step_pct: 5

# Exit immediately if the EMA9/EMA21 signal reverses direction while a trade is
# open (e.g. a SELL signal fires while holding a CE) -- the strategy itself is
# saying the setup that justified the entry no longer holds.
signal_reversal_exit_enabled: true

# Exit if the option's IV has dropped this % from its value at entry, even if
# index points haven't hit stop-loss -- IV crush eroding the premium out from
# under an otherwise-fine index move. Skipped gracefully for a cycle if entry IV
# wasn't recorded or a fresh IV read isn't available.
iv_exit_enabled: true
iv_exit_drop_pct: 20
iv_check_interval_seconds: 30   # throttle: this is a separate whole-chain API call, don't hammer it every poll cycle

# Exit early if the index moves momentum_exit_points in the trade's favorable
# direction within momentum_window_minutes -- a fast move is treated as likely to
# fade/reverse, so lock in the gain rather than wait for the normal target.
momentum_exit_enabled: true
momentum_window_minutes: 10
momentum_exit_points: 60

# Pullback entry: don't chase an already-extended crossover candle -- wait for
# price to pull back to that candle's own low (BUY) / high (SELL) instead of
# entering immediately. Backtested on 1000 days: beat immediate entry on total
# points (+10.8%), win rate, AND avg points/trade at this threshold, and the
# improvement held across 80-150pts, not just one lucky number. If the pullback
# never comes (or a fresh opposite signal appears first), the trade is skipped
# rather than chased late.
pullback_entry_enabled: true
pullback_extended_threshold_points: 100

# Extreme Point Rule (Wilder's DMI safeguard, applied to whichever signal strategy this
# instrument runs): don't enter on the signal candle itself -- only enter once price breaks
# that candle's own high (BUY) / low (SELL) within extreme_point_rule_max_wait_bars candles,
# otherwise treat it as a false/whipsaw signal and skip. Backtested on all 4 live instruments
# and 3 distinct base strategies (EMA crossover, Keltner Channel, Donchian Channel): NIFTY
# 1146->871 trades, 6384->10829pts (+70%); BANKNIFTY 9334->22746pts (+144%); FINNIFTY
# 8441->11622pts (+38%); MIDCPNIFTY 9228->13266pts (+44%) -- both-halves and walk-forward
# validated (see research/NIFTY_INDICATOR_CORRELATION_FINDINGS.md Phase 2.2/2.3/2.6/3.0),
# still net profitable under stress-case F&O costs (Phase 3.1). Starts DISABLED -- flip to
# true only after paper-trading review, per the standing rule to ask before any live change.
extreme_point_rule_enabled: false
extreme_point_rule_max_wait_bars: 3

# RSI-confirm widened take-profit: at the checkpoint (rsi_confirm_widened_tp_checkpoint_bars
# candles after entry), if the trade is STILL OPEN and RSI has moved with the trade's own
# direction since entry, the take-profit target widens from that instrument's normal
# take_profit_points to InstrumentConfig.rsi_confirm_widened_tp_points for the rest of the
# trade -- stop-loss and the premium-pct take-profit are both left completely unchanged
# either way (this only ever captures MORE upside on a confirmed winner, never touches risk).
# Backtested on NIFTY only (research/rsi_confirm_widened_tp_study.py, Phase 2.1/3.0/3.1):
# 6384->12108pts (+90%) combined with the Extreme Point Rule above, both-halves and
# walk-forward validated, net profitable under stress-case costs. IMPORTANT: this widens only
# the INDEX-points take-profit -- take_profit_premium_pct (10% for NIFTY) is a live-only
# mechanism that was never part of the backtest (pure index-points simulation) and is
# deliberately left untouched, so realized gains on a confirmed trade may be smaller live than
# backtested if the premium-pct check fires first. That is a conservative gap, not a risk.
# This master switch alone does nothing -- it's only active for instruments that also set
# rsi_confirm_widened_tp_points (NIFTY, below); other instruments are untouched even when this
# is true. Starts DISABLED -- flip to true only after paper-trading review.
rsi_confirm_widened_tp_enabled: false
rsi_confirm_widened_tp_checkpoint_bars: 6

# Seed value for the account capital ledger (data/trades.db, table "account") --
# only used the very first time it's ever read. From then on capital compounds
# across days (each trade's pnl adds/subtracts from it); it does NOT reset to
# this value every morning.
starting_capital: 200000

# VM cost savings: on a Linux VM that's meant to auto-start each morning, this
# powers the machine off after any clean exit (holiday, weekend, or market closed
# for the day) -- so it doesn't sit running (and billing) the rest of the day.
# Never fires on an error exit (e.g. broker connect failure), so there's a window
# to look at what went wrong first. Leave false on your own dev machine -- only
# turn this on on the actual deployed VM. Requires passwordless sudo for the
# `shutdown` command for whichever user runs this (see deploy/README.md).
shutdown_vm_on_exit: false

risk:
  daily_loss_limit: 5000       # rupees; bot stops opening new trades once breached
  max_trades_per_day: 12       # across all instruments combined -- was raised
                                # as high as 33 for the full 11-instrument set
                                # (see git history / RULES.md), scaled to
                                # 12 = 4 instruments x max_trades_per_instrument
                                # (NIFTY/BANKNIFTY/FINNIFTY/MIDCPNIFTY;
                                # NIFTYNXT50 removed 2026-09-21, SENSEX removed
                                # 2026-09-22, both as illiquid), so the combined
                                # cap still never binds before an individual
                                # instrument's own limit. daily_loss_limit (rupees)
                                # remains the real account-wide brake, not this count.
  max_trades_per_instrument: 3

# Local historical-candle cache used to compute the EMA(9)/EMA(21) crossover signal
# ourselves from real broker data. Stored as one Excel file per instrument under
# storage_dir. See alpha/historical_data.py and alpha/ema_crossover_signal.py.
historical_data:
  interval: "FIVE_MINUTE"       # Angel One getCandleData interval string
  interval_minutes: 5           # must match `interval` above -- used to throttle re-fetches
  lookback_days: 100            # size of the initial backfill; confirmed to work in one request
  storage_dir: "data/historical"

# Each instrument uses whatever signal_strategy was actually validated for IT --
# never assume one strategy transfers across instruments. NIFTY: EMA(9)/EMA(21)
# crossover, backtested as the single best performer out of 27 strategies/variants
# tested on 1000 days of NIFTY data (legacy/backtest/run_strategy_comparison.py):
# 6,350 points total, 46.8% win rate, unfiltered. BANKNIFTY: that same EMA9/21
# crossover LOSES money on BANKNIFTY (-1268pts backtested) -- RSI(14)
# overbought/oversold wins there instead (+2601pts, 56.3% win rate, best of 26
# tested). BANKNIFTY's backtest is only ~100 days (Angel One's historical API
# caps 5-min data there; NIFTY's 1000-day dataset was accumulated over time, not
# fetched in one call) -- treat its numbers as a starting point to refine with
# more data, not NIFTY-level evidence.
instruments:
  - name: NIFTY
    exchange_index_symbol: NIFTY
    index_token: "99926000"          # used for LTP quotes
    candle_token: "99926000"         # used for historical candle data (getCandleData)
    signal_strategy: ema_crossover
    lot_size: 65                # NSE lot size as of 2026 -- verify before every expiry cycle, NSE revises periodically
    quantity_lots: 1
    buy_strike_offset: 0        # ATM -- matches the ATM assumption used throughout backtesting
    sell_strike_offset: 0
    take_profit_points: 100     # points of INDEX movement -- matches the backtest exactly
    take_profit_premium_pct: 10 # ALSO exit if the option premium itself rises 10% from entry (e.g. 150 -> 165), whichever hits first
    stop_loss_points: 50        # index-based only -- the premium % above is take-profit only, not used for stop-loss
    min_premium_threshold: 120  # only used when strike_selection_mode is "min_premium" -- user-specified value
    entry_start_time: "09:30"        # no entries before this -- matches the backtest's ENTRY_START_TIME
    entry_cutoff_time: "14:50"       # no new entries after this -- matches the backtest's FORCE_EXIT_TIME (no separate buffer)
    # No new entries at all on the contract's own expiry day, regardless of the
    # cutoff above (see instrument_engine.py) -- real 0DTE gamma/spread risk
    # the backtest can't see. This is a deliberate deviation from what was
    # backtested (the 1000-day backtest traded straight through expiry days).
    force_exit_time: "14:50"         # force-close any open position at/after this time -- matches the backtest
    force_exit_time_expiry_day: "14:45"     # safety fallback: force-close if a position is somehow still open on expiry day
    # Widened take-profit target once RSI confirms (see rsi_confirm_widened_tp_enabled above)
    # -- only takes effect once that global flag is also true. NIFTY-only: backtested on
    # NIFTY data only, not validated for any other instrument (do not copy this to
    # BANKNIFTY/FINNIFTY/MIDCPNIFTY without separately backtesting it there first).
    rsi_confirm_widened_tp_points: 400

  - name: BANKNIFTY
    exchange_index_symbol: BANKNIFTY
    index_token: "99926009"
    candle_token: "99926009"
    signal_strategy: ema_crossover  # SAME as NIFTY -- an earlier RSI-based recommendation was found wrong on the full 1000-day backtest (only looked good on a 100-day sample), see RULES.md Lesson #1
    lot_size: 30                 # confirmed live from the instrument master -- verify before every expiry cycle
    quantity_lots: 1
    buy_strike_offset: 0
    sell_strike_offset: 0
    take_profit_points: 300      # backtested on full 1000 days: 45.7% WR, +9154.60pts (see RULES.md)
    take_profit_premium_pct: 10  # not separately backtested for BANKNIFTY -- reusing NIFTY's value as a starting point
    stop_loss_points: 150
    min_premium_threshold: 360   # 1.2 x take_profit_points, same ratio as NIFTY's user-specified 120/100 -- not separately validated
    entry_start_time: "09:30"
    entry_cutoff_time: "14:50"
    force_exit_time: "14:50"
    force_exit_time_expiry_day: "14:45"

  - name: FINNIFTY
    exchange_index_symbol: FINNIFTY
    index_token: "99926037"
    candle_token: "99926037"
    signal_strategy: keltner_channel  # NOT ema_crossover or rsi_oversold -- both underperform on FINNIFTY, see RULES.md
    lot_size: 60                 # confirmed live from the instrument master -- verify before every expiry cycle
    quantity_lots: 1
    buy_strike_offset: 0
    sell_strike_offset: 0
    take_profit_points: 150      # backtested on full 1000 days: 49.4% WR, +8623.00pts, robust across nearby TP/SL too (see RULES.md)
    take_profit_premium_pct: 10  # not separately backtested for FINNIFTY -- reusing NIFTY's value as a starting point
    stop_loss_points: 75
    min_premium_threshold: 180   # 1.2 x take_profit_points, same ratio as NIFTY's user-specified 120/100 -- not separately validated
    entry_start_time: "09:30"
    entry_cutoff_time: "14:50"
    force_exit_time: "14:50"
    force_exit_time_expiry_day: "14:45"

  - name: MIDCPNIFTY
    exchange_index_symbol: MIDCPNIFTY
    index_token: "26074"
    candle_token: "99926074"
    signal_strategy: donchian_channel   # backtested: 1000d, 50.9% WR, net Rs192.61/trade after F&O costs (TP=120/SL=58) -- best net/trade of any instrument tested so far
    lot_size: 120                       # confirmed live from the instrument master
    quantity_lots: 1
    buy_strike_offset: 0
    sell_strike_offset: 0
    take_profit_points: 120
    take_profit_premium_pct: 10
    stop_loss_points: 58
    min_premium_threshold: 144   # 1.2 x take_profit_points, same ratio as NIFTY's user-specified 120/100 -- not separately validated
    entry_start_time: "09:30"
    entry_cutoff_time: "14:50"
    force_exit_time: "14:50"
    force_exit_time_expiry_day: "14:45"

  # SENSEX was REMOVED on 2026-09-22 (user decision: BSE/BFO options low liquidity). See RULES.md
  # ("SENSEX REMOVED"). To restore it, take the block from git history (present through commit
  # 23eb2bd).

  # NIFTYNXT50 (Nifty Next 50) was REMOVED on 2026-09-21: its options are illiquid. Live paper
  # trades opened and closed at the identical price (3488.05 -> 3488.05, 2902.55 -> 2902.55,
  # P&L Rs0), i.e. no real two-sided market, so the backtested edge (which used index points)
  # cannot be traded. See RULES.md ("NIFTYNXT50 REMOVED"). To restore it, take the block from git history.

  # --- Stock options and additional midcap instruments (RELIANCE, INFY,
  # SBIN, PNB, FEDERALBNK, IDFCFIRSTB, BANKBARODA) were backtested and built
  # in code on 2026-09-18 (see RULES.md for full writeup and git history for
  # the exact config) but are DELIBERATELY EXCLUDED from phase-4 -- this
  # phase deploys only the 4 index instruments (NIFTY/BANKNIFTY/FINNIFTY/
  # MIDCPNIFTY). Re-add them from git history when ready to expand again.

market:
  open_time: "09:22"
  close_time: "15:20"

# Exchange holiday calendar, one block per year: holiday_list_<YYYY>.
# At startup the bot takes today's date, derives the year, and looks up
# holiday_list_<that year> to decide whether to trade today (alpha/config.py
# AppConfig.holidays_for_year). Add a new block every December for the coming year --
# NSE publishes it then. If the block for the current year is missing, the bot logs a
# warning and treats today as a trading day (fails open, not closed).

# Source: NSE trading holidays for equities/F&O, calendar year 2026.
# Includes 08-Nov-2026 (Diwali Laxmi Pujan) -- regular trading is closed that day;
# only the special ceremonial Muhurat Trading session runs, which this bot should
# not participate in.
